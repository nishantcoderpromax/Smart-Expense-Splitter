server.port = ${PORT:8080}

spring.application.name=backend

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_splitter
spring.datasource.username=postgres
spring.datasource.password=abcd@1234

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only checks it matches, never auto-alters it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
jwt.secret=change-this-to-a-long-random-base64-secret-in-production
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Google OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Where the backend sends the browser after a successful Google login,
# carrying our own JWT tokens as query params for the frontend to pick up.
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#CORS
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@splitledger.local}